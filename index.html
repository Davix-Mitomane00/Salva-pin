<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4FA3">
<title>Salva-pin</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --ink:#1D2327; --muted:#5B6469; --line:#C7CDC9;
  --blue:#1F4FA3; --blue-press:#173E82; --on-blue:#FFFFFF; --red:#C8261E;
  --warn-bg:#FFF3D1; --warn-line:#C99400; --ok:#2E7D4F; --plate:#FFFFFF; --plate-ink:#1D2327;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15191B; --surface:#1F2427; --ink:#E8ECEA; --muted:#9AA3A7; --line:#3A4246;
    --blue:#3B6CCB; --blue-press:#2F59AA; --on-blue:#FFFFFF; --red:#E2463D;
    --warn-bg:#3A3016; --warn-line:#C99A1A; --ok:#5DBB86; --plate:#EDEFEC; --plate-ink:#1D2327;
  }
}
:root[data-theme="dark"]{
  --bg:#15191B; --surface:#1F2427; --ink:#E8ECEA; --muted:#9AA3A7; --line:#3A4246;
  --blue:#3B6CCB; --blue-press:#2F59AA; --on-blue:#FFFFFF; --red:#E2463D;
  --warn-bg:#3A3016; --warn-line:#C99A1A; --ok:#5DBB86; --plate:#EDEFEC; --plate-ink:#1D2327;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 140px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
h1{font-size:34px;font-weight:700;margin:0;letter-spacing:.2px;line-height:1.05}
.top p{margin:4px 0 0;color:var(--muted)}
.store{margin-top:10px;font-size:15px;color:var(--muted)}
.store.warn{color:var(--ink);background:var(--warn-bg);border-left:4px solid var(--warn-line);padding:8px 10px;border-radius:6px}

.form{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px;margin:18px 0 8px}
.form h2{font-size:26px;font-weight:700;margin:0 0 10px}
label,legend{display:block;font-weight:500;font-size:15px;color:var(--muted);margin:14px 0 6px}
.opt{font-weight:400}
input[type=text],textarea{
  width:100%;font:inherit;font-size:18px;color:var(--ink);background:var(--bg);
  border:2px solid var(--line);border-radius:10px;padding:12px;
}
textarea{resize:vertical;min-height:58px}
input:focus,textarea:focus{outline:none;border-color:var(--blue)}
#addr{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:22px;font-weight:600}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}

.gps{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:16px;padding:10px 12px;border-radius:10px;background:var(--bg)}
.gps .dot{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none}
.gps[data-s=search] .dot{background:var(--warn-line);animation:pulse 1.2s ease-in-out infinite}
.gps[data-s=ok] .dot{background:var(--ok)}
.gps[data-s=low] .dot,.gps[data-s=fail] .dot,.gps[data-s=denied] .dot{background:var(--red)}
.gps .t{flex:1;min-width:0}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){.gps .dot{animation:none!important}}

fieldset{border:0;padding:0;margin:0}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label.z{
  margin:0;flex:1 1 auto;text-align:center;padding:11px 12px;border:2px solid var(--line);border-radius:10px;
  color:var(--ink);font-size:17px;font-weight:500;cursor:pointer;background:var(--bg)
}
.seg input:checked + label.z{border-color:var(--blue);background:var(--blue);color:var(--on-blue)}
.seg input:focus-visible + label.z{outline:3px solid var(--blue);outline-offset:2px}

.dup{margin-top:14px;background:var(--warn-bg);border-left:4px solid var(--warn-line);border-radius:8px;padding:10px 12px;font-size:15px}
.dup strong{display:block;font-size:16px;margin-bottom:4px}
.dup ul{margin:6px 0;padding-left:18px}
.err{margin-top:12px;color:var(--red);font-weight:600;font-size:15px}

.actions{display:flex;gap:10px;margin-top:16px}
button{font:inherit;cursor:pointer}
.btn{border-radius:10px;padding:13px 16px;font-size:17px;font-weight:600;border:2px solid transparent}
.primary{background:var(--blue);color:var(--on-blue);flex:2}
.primary:active{background:var(--blue-press)}
.ghost{background:transparent;color:var(--ink);border-color:var(--line);flex:1}
.link{background:none;border:0;color:var(--blue);font-weight:600;padding:4px 0;font-size:15px;text-decoration:underline;text-underline-offset:3px}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.day{margin-top:26px}
.day > summary{list-style:none;cursor:pointer}
.day > summary::-webkit-details-marker{display:none}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:4px}
.dayhead h3{font-size:23px;font-weight:600;margin:0}
.dayhead .n{color:var(--muted);font-size:15px;white-space:nowrap}
details.day:not([open]) .dayhead{border-bottom-color:var(--line)}
.stops{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.plate{
  grid-row:span 2;align-self:start;display:inline-flex;align-items:stretch;min-width:52px;height:38px;
  background:var(--plate);color:var(--plate-ink);border:2px solid var(--plate-ink);border-radius:4px;overflow:hidden
}
.plate::before{content:"";width:9px;background:var(--red);flex:none}
.plate b{flex:1;display:flex;align-items:center;justify-content:center;padding:0 8px;
  font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:22px}
.addr{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:21px;font-weight:600;line-height:1.15;word-break:break-word}
.meta{color:var(--muted);font-size:15px}
.meta .low{color:var(--red)}
.nota{grid-column:2;font-size:15px;margin-top:2px;white-space:pre-wrap;word-break:break-word}
.acts{grid-column:2;display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
.acts a{color:var(--blue);font-weight:600;font-size:15px}
.acts .del[data-armed]{color:var(--red)}
.empty{margin-top:30px;padding:22px 18px;border:2px dashed var(--line);border-radius:14px;color:var(--muted)}
.empty b{color:var(--ink);display:block;font-size:18px;margin-bottom:4px}

.backup{margin-top:34px;padding-top:16px;border-top:1px solid var(--line)}
.backup h2{font-size:23px;font-weight:600;margin:0 0 4px}
.backup p{font-size:15px;color:var(--muted);margin:0 0 12px}
.backup .row{display:flex;gap:10px;flex-wrap:wrap}
.backup .btn{flex:1 1 140px;background:var(--surface);color:var(--ink);border-color:var(--ink)}
.backup .btn.soft{border-color:var(--line)}
#lastBackup.warn{color:var(--ink);background:var(--warn-bg);border-left:4px solid var(--warn-line);padding:8px 10px;border-radius:6px}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .inner{max-width:560px;margin:0 auto}
.big{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:76px;border:0;border-radius:14px;background:var(--blue);color:var(--on-blue);
  box-shadow:0 3px 0 var(--blue-press)}
.big:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blue-press)}
.big .l{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:32px;line-height:1}
.big .s{font-size:15px;opacity:.9;margin-top:3px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;max-width:calc(100% - 32px);
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Salva-pin</h1>
    <p id="stats">Nessuna tappa salvata</p>
    <p id="store" class="store"></p>
  </header>

  <section id="form" class="form" hidden aria-labelledby="formTitle">
    <h2 id="formTitle">Tappa 1</h2>

    <div id="gps" class="gps" data-s="search" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <span class="t" id="gpsText">Cerco la posizione…</span>
      <button type="button" id="gpsBtn" class="link" hidden>Riprova</button>
    </div>

    <div id="coordWrap" hidden>
      <label for="coordIn">Coordinate o link di Maps</label>
      <input type="text" id="coordIn" placeholder="39.3612, 16.2243" autocomplete="off">
      <p class="hint">In Google Maps tieni premuto sul punto esatto, copia le coordinate e incollale qui.</p>
    </div>

    <label for="addr">Indirizzo come è scritto sul pacco</label>
    <input type="text" id="addr" list="addrList" autocomplete="off" autocapitalize="words" placeholder="Via …, 7">
    <datalist id="addrList"></datalist>

    <fieldset>
      <legend>Zona</legend>
      <div class="seg" id="zones"></div>
    </fieldset>

    <label for="note">Nota <span class="opt">(facoltativa)</span></label>
    <textarea id="note" rows="2" placeholder="Scala B, citofono, nome nuovo della via…"></textarea>

    <div id="dup" class="dup" hidden></div>
    <p id="err" class="err" hidden></p>

    <div class="actions">
      <button type="button" id="cancelBtn" class="btn ghost">Annulla</button>
      <button type="button" id="saveBtn" class="btn primary">Salva tappa</button>
    </div>
  </section>

  <section id="list" aria-label="Tappe salvate"></section>

  <section class="backup" aria-labelledby="bkTitle">
    <h2 id="bkTitle">Backup</h2>
    <p id="lastBackup">Nessun backup ancora fatto.</p>
    <div class="row">
      <button type="button" id="exportBtn" class="btn">Scarica CSV</button>
      <button type="button" id="shareBtn" class="btn" hidden>Condividi CSV</button>
    </div>
    <p style="margin-top:10px">Il CSV si apre con Excel. A fine affiancamento caricalo nella chat con Claude per costruire il giro.</p>
    <div class="row">
      <button type="button" id="importBtn" class="btn soft">Importa backup</button>
      <input type="file" id="importFile" accept=".csv,text/csv,text/plain" hidden>
    </div>
  </section>
</div>

<div class="bar" id="bar">
  <div class="inner">
    <button type="button" id="newBtn" class="big">
      <span class="l">Salva qui</span>
      <span class="s" id="nextSeq">Tappa 1 di oggi</span>
    </button>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  const ZONES = ["Arcavacata","Cutura","Altra zona"];
  const DUP_METERS = 15;
  const KEY = "salvapin_tappe_v1";
  const $ = s => document.querySelector(s);

  // ---------- memoria del telefono ----------
  function loadLS(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
  function saveLS(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

  let recs = loadLS(KEY, {});
  let lastZone = loadLS("salvapin_zona", ZONES[0]);
  let lastExport = loadLS("salvapin_ultimo_backup", null);
  let persisted = null;

  function all(){ return Object.values(recs).filter(r => r && r.id); }
  function persist(){
    if (!saveLS(KEY, recs)) toast("Memoria piena: scarica il CSV ed elimina le tappe vecchie.");
  }

  // ---------- utilità ----------
  function el(tag, props, ...kids){
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})){
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()){
      if (c == null || c === false) continue;
      e.append(c.nodeType ? c : document.createTextNode(String(c)));
    }
    return e;
  }
  function pad(n){ return String(n).padStart(2,"0"); }
  function dayKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function todayKey(){ return dayKey(new Date()); }
  function timeStr(ts){ return new Date(ts).toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"}); }
  function dayLabel(k){
    const s = new Date(k+"T12:00:00").toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
    return k === todayKey() ? "Oggi, "+s : s.charAt(0).toUpperCase()+s.slice(1);
  }
  function shortDate(k){ const p = k.split("-"); return p[2]+"/"+p[1]; }
  function fullDate(k){ const p = k.split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
  function whenStr(ts){
    const d = new Date(ts), k = dayKey(d), y = new Date(); y.setDate(y.getDate()-1);
    const t = timeStr(ts);
    if (k === todayKey()) return "oggi alle "+t;
    if (k === dayKey(y)) return "ieri alle "+t;
    return "il "+shortDate(k)+" alle "+t;
  }
  function norm(s){
    return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
      .replace(/\bc\.?\s?da\b/g,"contrada").replace(/\bv\.\s?/g,"via ")
      .replace(/\bp\.?\s?zza\b/g,"piazza").replace(/[^a-z0-9]+/g," ").trim();
  }
  function dist(a,b){
    const R = 6371000, t = x => x*Math.PI/180;
    const dLat = t(b.lat-a.lat), dLng = t(b.lng-a.lng);
    const h = Math.sin(dLat/2)**2 + Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLng/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
  }
  function parseCoords(s){
    const m = (s||"").match(/(-?\d{1,2}\.\d+)\s*[,;\s]\s*(-?\d{1,3}\.\d+)/);
    if (!m) return null;
    const lat = +m[1], lng = +m[2];
    if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
    return {lat:+lat.toFixed(6), lng:+lng.toFixed(6), acc:null};
  }
  function newId(){ return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function mapsUrl(r){ return "https://www.google.com/maps/search/?api=1&query="+r.lat+","+r.lng; }
  function nextSeq(){
    const k = todayKey(); let max = 0;
    for (const r of all()) if (r.day === k && r.seq > max) max = r.seq;
    return max + 1;
  }
  let toastT = null;
  function toast(msg){
    const t = $("#toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2800);
  }

  // ---------- modulo tappa ----------
  const form = { mode:null, editId:null, pos:null, watch:null, dupOk:false };

  function buildZones(){
    const box = $("#zones"); box.textContent = "";
    ZONES.forEach((z,i) => box.append(
      el("input",{type:"radio",name:"zona",id:"z"+i,value:z}),
      el("label",{class:"z",for:"z"+i,text:z})
    ));
  }
  function setZone(z){
    const r = [...document.querySelectorAll("input[name=zona]")].find(x => x.value === z) || document.querySelector("input[name=zona]");
    r.checked = true;
  }
  function getZone(){ const r = document.querySelector("input[name=zona]:checked"); return r ? r.value : ZONES[0]; }

  function setGps(state, text, btn){
    $("#gps").dataset.s = state;
    $("#gpsText").textContent = text;
    const b = $("#gpsBtn");
    if (btn){ b.hidden = false; b.textContent = btn; } else b.hidden = true;
    $("#coordWrap").hidden = !(state === "denied" || state === "fail");
  }
  function stopGps(){ if (form.watch != null && navigator.geolocation) navigator.geolocation.clearWatch(form.watch); form.watch = null; }
  function startGps(){
    stopGps(); form.pos = null;
    if (!("geolocation" in navigator)){ setGps("fail","GPS non disponibile su questo dispositivo."); return; }
    setGps("search","Cerco la posizione…");
    const started = Date.now();
    form.watch = navigator.geolocation.watchPosition(p => {
      const c = {lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), acc:Math.round(p.coords.accuracy)};
      if (!form.pos || c.acc <= form.pos.acc) form.pos = c;
      const done = form.pos.acc <= 8 || Date.now() - started > 20000;
      if (form.pos.acc > 25){
        setGps(done ? "low" : "search", "Precisione bassa (±"+form.pos.acc+" m)"+(done ? ": avvicinati al portone e riprova." : ", sto migliorando…"), done ? "Riprova" : null);
      } else {
        setGps("ok","Posizione presa, precisione ±"+form.pos.acc+" m", done ? "Riprova" : null);
      }
      if (done) stopGps();
    }, err => {
      stopGps();
      if (form.pos) return;
      if (err.code === 1) setGps("denied","Permesso posizione negato. Attivalo nelle impostazioni dell'app, oppure incolla le coordinate da Maps.","Riprova");
      else setGps("fail","Posizione non trovata. Controlla che il GPS sia acceso.","Riprova");
    }, {enableHighAccuracy:true, timeout:20000, maximumAge:0});
  }

  function openForm(kind, rec){
    form.mode = kind; form.editId = rec ? rec.id : null; form.dupOk = false;
    $("#err").hidden = true; $("#dup").hidden = true; $("#coordIn").value = "";
    $("#saveBtn").textContent = kind === "edit" ? "Salva modifiche" : "Salva tappa";
    if (kind === "new"){
      $("#formTitle").textContent = "Tappa "+nextSeq()+" di oggi";
      $("#addr").value = ""; $("#note").value = ""; setZone(lastZone);
      startGps();
    } else {
      $("#formTitle").textContent = "Modifica tappa "+rec.seq+" del "+shortDate(rec.day);
      $("#addr").value = rec.indirizzo || ""; $("#note").value = rec.nota || ""; setZone(rec.zona);
      stopGps();
      form.pos = {lat:rec.lat, lng:rec.lng, acc:rec.acc};
      setGps("ok","Posizione salvata"+(rec.acc != null ? " (±"+rec.acc+" m)" : ""),"Usa la posizione attuale");
    }
    $("#form").hidden = false; $("#bar").hidden = true;
    window.scrollTo({top:0});
    setTimeout(() => { try{ $("#addr").focus({preventScroll:true}); }catch(e){} }, 50);
  }
  function closeForm(){
    stopGps(); form.mode = null; form.editId = null;
    $("#form").hidden = true; $("#bar").hidden = false;
  }

  function findDups(addr, pos, excludeId){
    const n = norm(addr), out = [];
    for (const r of all()){
      if (r.id === excludeId) continue;
      const same = n && norm(r.indirizzo) === n;
      const d = pos && r.lat != null ? dist(pos, r) : Infinity;
      if (same || d <= DUP_METERS) out.push({r, d});
    }
    return out.sort((a,b) => b.r.ts - a.r.ts).slice(0,3);
  }
  function showDups(list){
    const box = $("#dup"); box.textContent = "";
    box.append(el("strong",{text:"Questo indirizzo o punto è già salvato"}));
    const ul = el("ul");
    list.forEach(({r,d}) => {
      let t = r.indirizzo+", tappa "+r.seq+" del "+shortDate(r.day)+" alle "+timeStr(r.ts);
      if (isFinite(d)) t += " (a "+Math.round(d)+" m da qui)";
      ul.append(el("li",{text:t}));
    });
    box.append(ul, el("span",{text:"Se è la stessa consegna in un altro giorno, salvala pure: serve a ricostruire l'ordine del giro. Se l'hai già salvata oggi, annulla."}));
    box.hidden = false;
  }

  function save(){
    const err = $("#err"); err.hidden = true;
    const indirizzo = $("#addr").value.trim().replace(/\s+/g," ");
    if (!indirizzo){ err.textContent = "Scrivi l'indirizzo come è scritto sul pacco."; err.hidden = false; $("#addr").focus(); return; }
    let pos = form.pos, src = "gps";
    const manual = parseCoords($("#coordIn").value);
    if (manual){ pos = manual; src = "manuale"; }
    if (!pos){
      err.textContent = form.watch != null ? "Aspetta qualche secondo: il GPS sta ancora cercando la posizione." : "Manca la posizione: riprova il GPS o incolla le coordinate da Maps.";
      err.hidden = false; return;
    }
    const zona = getZone(), nota = $("#note").value.trim();
    if (form.mode === "new" && !form.dupOk){
      const d = findDups(indirizzo, pos, null);
      if (d.length){ showDups(d); form.dupOk = true; $("#saveBtn").textContent = "Salva comunque"; return; }
    }
    let rec;
    if (form.mode === "edit"){
      const old = recs[form.editId];
      if (!old){ closeForm(); return; }
      const moved = pos.lat !== old.lat || pos.lng !== old.lng;
      rec = Object.assign({}, old, {indirizzo, zona, nota, lat:pos.lat, lng:pos.lng, acc:pos.acc ?? null,
        src: moved ? src : (old.src || "gps"), modificato:Date.now()});
    } else {
      const now = new Date();
      rec = {id:newId(), ts:now.getTime(), day:dayKey(now), seq:nextSeq(), indirizzo, zona, nota,
        lat:pos.lat, lng:pos.lng, acc:pos.acc ?? null, src};
    }
    lastZone = zona; saveLS("salvapin_zona", zona);
    const wasNew = form.mode === "new";
    recs[rec.id] = rec; persist();
    closeForm(); render();
    toast(wasNew ? "Tappa "+rec.seq+" salvata" : "Modifiche salvate");
  }

  function removeRec(id){
    delete recs[id]; persist(); render(); toast("Tappa eliminata");
  }

  // ---------- disegno della pagina ----------
  function renderStore(){
    const s = $("#store"); s.classList.remove("warn");
    if (persisted === false){
      s.classList.add("warn");
      s.textContent = "Le tappe sono salvate sul telefono, ma Android potrebbe cancellarle se manca spazio. Installa l'app sulla home e fai il backup ogni sera.";
    } else {
      s.textContent = "Tappe salvate sul telefono, anche senza rete.";
    }
    const lb = $("#lastBackup"); lb.classList.remove("warn");
    const newer = all().filter(r => !lastExport || (r.modificato || r.ts) > lastExport).length;
    if (!lastExport){
      lb.textContent = all().length ? "Nessun backup ancora fatto. Scarica il CSV a fine giornata." : "Nessun backup ancora fatto.";
      if (all().length) lb.classList.add("warn");
    } else {
      lb.textContent = "Ultimo backup "+whenStr(lastExport)+"."+(newer ? " "+newer+(newer === 1 ? " tappa nuova o modificata" : " tappe nuove o modificate")+" da allora." : " Tutto salvato.");
      if (newer) lb.classList.add("warn");
    }
  }

  function render(){
    const list = all();
    const tk = todayKey();
    const today = list.filter(r => r.day === tk).length;
    const uniq = new Set(list.map(r => norm(r.indirizzo))).size;
    $("#stats").textContent = list.length
      ? list.length+(list.length === 1 ? " tappa salvata" : " tappe salvate")+", "+today+" oggi. "+uniq+(uniq === 1 ? " indirizzo diverso." : " indirizzi diversi.")
      : "Nessuna tappa salvata";
    $("#nextSeq").textContent = "Tappa "+nextSeq()+" di oggi";

    const dl = $("#addrList"); dl.textContent = "";
    const seen = new Set();
    list.slice().sort((a,b) => b.ts - a.ts).forEach(r => {
      const n = norm(r.indirizzo);
      if (!seen.has(n)){ seen.add(n); dl.append(el("option",{value:r.indirizzo})); }
    });

    const box = $("#list"); box.textContent = "";
    if (!list.length){
      box.append(el("div",{class:"empty"}, el("b",{text:"Ancora nessuna tappa"}),
        "Quando sei davanti al portone premi Salva qui: la posizione e l'ora si registrano da sole."));
      renderStore(); return;
    }
    const byDay = {};
    list.forEach(r => (byDay[r.day] = byDay[r.day] || []).push(r));
    Object.keys(byDay).sort().reverse().forEach((k, i) => {
      const items = byDay[k].sort((a,b) => (a.seq - b.seq) || (a.ts - b.ts));
      const det = el("details",{class:"day"});
      if (k === tk || i === 0) det.open = true;
      det.append(el("summary",{}, el("div",{class:"dayhead"},
        el("h3",{text:dayLabel(k)}),
        el("span",{class:"n",text:items.length+(items.length === 1 ? " tappa" : " tappe")})
      )));
      const ol = el("ol",{class:"stops"});
      items.forEach(r => {
        const meta = el("div",{class:"meta"}, timeStr(r.ts)+", "+(r.zona || "")+", ");
        if (r.acc != null) meta.append(el("span",{class: r.acc > 25 ? "low" : "", text:"±"+r.acc+" m"}));
        else meta.append("coordinate inserite a mano");
        const del = el("button",{type:"button",class:"link del",text:"Elimina"});
        del.addEventListener("click", () => {
          if (del.dataset.armed !== undefined){ removeRec(r.id); return; }
          del.dataset.armed = ""; del.textContent = "Tocca di nuovo per eliminare";
          setTimeout(() => { if (del.isConnected){ delete del.dataset.armed; del.textContent = "Elimina"; } }, 4000);
        });
        ol.append(el("li",{class:"stop"},
          el("span",{class:"plate","aria-label":"Tappa "+r.seq}, el("b",{text:String(r.seq)})),
          el("div",{class:"addr",text:r.indirizzo}),
          meta,
          r.nota ? el("div",{class:"nota",text:r.nota}) : null,
          el("div",{class:"acts"},
            el("a",{href:mapsUrl(r),target:"_blank",rel:"noopener",text:"Apri in Maps"}),
            el("button",{type:"button",class:"link",text:"Modifica",onclick:() => openForm("edit", r)}),
            del
          )
        ));
      });
      det.append(ol);
      box.append(det);
    });
    renderStore();
  }

  // ---------- backup ----------
  const HEAD = ["data","ora","tappa_del_giorno","zona","indirizzo","nota","lat","lng","precisione_m","origine_posizione","id","timestamp"];
  function toCSV(){
    const esc = v => { let s = v == null ? "" : String(v); if (/[;"\n\r]/.test(s)) s = '"'+s.replace(/"/g,'""')+'"'; return s; };
    const rows = all().sort((a,b) => a.ts - b.ts).map(r => [
      fullDate(r.day), timeStr(r.ts), r.seq, r.zona, r.indirizzo, r.nota, r.lat, r.lng, r.acc, r.src, r.id, r.ts
    ]);
    return "\ufeff"+[HEAD].concat(rows).map(r => r.map(esc).join(";")).join("\r\n");
  }
  function csvFile(){
    return new File([toCSV()], "salva-pin_"+todayKey()+".csv", {type:"text/csv"});
  }
  function markExported(){
    lastExport = Date.now(); saveLS("salvapin_ultimo_backup", lastExport); renderStore();
  }
  function doDownload(){
    if (!all().length){ toast("Non ci sono tappe da salvare"); return; }
    const f = csvFile();
    const url = URL.createObjectURL(f);
    const a = el("a",{href:url,download:f.name});
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    markExported(); toast("CSV scaricato nella cartella Download");
  }
  async function doShare(){
    if (!all().length){ toast("Non ci sono tappe da condividere"); return; }
    const f = csvFile();
    try{
      await navigator.share({files:[f], title:"Salva-pin", text:"Backup tappe Salva-pin"});
      markExported();
    }catch(e){
      if (e && e.name === "AbortError") return;
      toast("Condivisione non riuscita: usa Scarica CSV");
    }
  }

  function parseCSV(text){
    text = text.replace(/^\ufeff/,"");
    const firstLine = text.split(/\r?\n/,1)[0] || "";
    const sep = (firstLine.split(";").length >= firstLine.split(",").length) ? ";" : ",";
    const rows = []; let row = [], cur = "", q = false;
    for (let i = 0; i < text.length; i++){
      const ch = text[i];
      if (q){
        if (ch === '"'){ if (text[i+1] === '"'){ cur += '"'; i++; } else q = false; }
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === sep){ row.push(cur); cur = ""; }
      else if (ch === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; }
      else if (ch !== "\r") cur += ch;
    }
    if (cur !== "" || row.length){ row.push(cur); rows.push(row); }
    return rows.filter(r => r.some(c => c.trim() !== ""));
  }
  function toDayKey(s){
    s = (s||"").trim();
    let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    if (m) return m[3]+"-"+pad(+m[2])+"-"+pad(+m[1]);
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return s;
    return null;
  }
  async function doImport(file){
    let text;
    try{ text = await file.text(); }catch(e){ toast("Non riesco a leggere il file"); return; }
    const rows = parseCSV(text);
    if (rows.length < 2){ toast("Il file non contiene tappe"); return; }
    const h = rows[0].map(x => x.trim().toLowerCase());
    const col = name => h.indexOf(name);
    const need = ["data","ora","indirizzo","lat","lng"];
    if (need.some(n => col(n) < 0)){ toast("Questo file non è un backup di Salva-pin"); return; }
    let added = 0, skipped = 0;
    rows.slice(1).forEach(c => {
      const get = n => { const i = col(n); return i < 0 ? "" : (c[i] || "").trim(); };
      const day = toDayKey(get("data"));
      const lat = parseFloat(get("lat").replace(",", ".")), lng = parseFloat(get("lng").replace(",", "."));
      const indirizzo = get("indirizzo");
      if (!day || !indirizzo || !isFinite(lat) || !isFinite(lng)) { skipped++; return; }
      let ts = parseInt(get("timestamp"), 10);
      if (!isFinite(ts)){
        const [hh, mm] = (get("ora") || "00:00").split(":");
        ts = new Date(day+"T"+pad(+hh||0)+":"+pad(+mm||0)+":00").getTime();
      }
      const seq = parseInt(get("tappa_del_giorno"), 10) || 0;
      const id = get("id") || ("i"+day.replace(/-/g,"")+"_"+seq+"_"+norm(indirizzo).replace(/ /g,"-").slice(0,40));
      if (recs[id]){ skipped++; return; }
      const acc = parseInt(get("precisione_m"), 10);
      recs[id] = {id, ts, day, seq, indirizzo, zona:get("zona") || ZONES[0], nota:get("nota"),
        lat:+lat.toFixed(6), lng:+lng.toFixed(6), acc: isFinite(acc) ? acc : null, src:get("origine_posizione") || "gps"};
      added++;
    });
    persist(); render();
    toast(added ? "Importate "+added+(added === 1 ? " tappa" : " tappe")+(skipped ? ", "+skipped+" già presenti o non valide" : "") : "Nessuna tappa nuova nel file");
  }

  // ---------- avvio ----------
  buildZones(); setZone(lastZone);
  $("#newBtn").addEventListener("click", () => openForm("new"));
  $("#cancelBtn").addEventListener("click", closeForm);
  $("#saveBtn").addEventListener("click", save);
  $("#gpsBtn").addEventListener("click", startGps);
  $("#addr").addEventListener("input", () => {
    if (form.dupOk){ form.dupOk = false; $("#dup").hidden = true; $("#saveBtn").textContent = form.mode === "edit" ? "Salva modifiche" : "Salva tappa"; }
  });
  $("#addr").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); $("#note").focus(); } });
  $("#exportBtn").addEventListener("click", doDownload);
  $("#shareBtn").addEventListener("click", doShare);
  $("#importBtn").addEventListener("click", () => $("#importFile").click());
  $("#importFile").addEventListener("change", e => { const f = e.target.files && e.target.files[0]; if (f) doImport(f); e.target.value = ""; });
  window.addEventListener("storage", e => { if (e.key === KEY){ recs = loadLS(KEY, {}); if (!form.mode) render(); } });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && !form.mode) render(); });
  setInterval(() => { if (!form.mode) render(); }, 60000);

  try{
    const probe = new File(["x"], "x.csv", {type:"text/csv"});
    if (navigator.canShare && navigator.canShare({files:[probe]})) $("#shareBtn").hidden = false;
  }catch(e){}

  if (navigator.storage && navigator.storage.persist){
    navigator.storage.persisted().then(p => p || navigator.storage.persist()).then(p => { persisted = !!p; renderStore(); }).catch(() => {});
  }
  if ("serviceWorker" in navigator){
    window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); });
  }

  render();
})();
</script>
</body>
</html>
